services:
  genie-provisioner:
    profiles: ["chatbot"]
    build:
      context: ./data
      dockerfile: Dockerfile.genie
    restart: unless-stopped
    environment:
      SOURCE_DATABASE_URL: ${DATABASE_URL:-}
    volumes:
      - ./.env.genie-worker.json:/run/genie-worker.json:ro
      - ./backend:/runtime
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fashion}
      POSTGRES_USER: ${POSTGRES_USER:-fashion}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fashion}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/docker/postgres-init.sql:/docker-entrypoint-initdb.d/01-create-test-database.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://${POSTGRES_USER:-fashion}:${POSTGRES_PASSWORD:-fashion}@db:5432/${POSTGRES_DB:-fashion}}
      TEST_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-fashion}:${POSTGRES_PASSWORD:-fashion}@db:5432/fashion_test
      JWT_SECRET: ${JWT_SECRET:-change-me-before-production-use-at-least-32-characters}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-60}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_APP_PASSWORD: ${SMTP_APP_PASSWORD:-}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-Fashion E-Commerce}
      FRONTEND_PUBLIC_URL: ${FRONTEND_PUBLIC_URL:-http://localhost:5173}
      VERIFY_EMAIL_EXPIRE_MINUTES: ${VERIFY_EMAIL_EXPIRE_MINUTES:-480}
      RESET_PASSWORD_EXPIRE_MINUTES: ${RESET_PASSWORD_EXPIRE_MINUTES:-30}
      SMTP_TIMEOUT_SECONDS: ${SMTP_TIMEOUT_SECONDS:-10}
      GENIE_CONFIG_PATH: ${GENIE_CONFIG_PATH:-}
      PRODUCT_IMAGE_DIRECTORY: ${PRODUCT_IMAGE_DIRECTORY:-runtime/product-images}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
      VITE_DATABRICKS_DASHBOARD_URL: ${VITE_DATABRICKS_DASHBOARD_URL:-}
      VITE_DATABRICKS_GENIE_URL: ${VITE_DATABRICKS_GENIE_URL:-}
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend

volumes:
  postgres_data:
  frontend_node_modules:
