name: daln-demo

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fashion_demo
      POSTGRES_USER: fashion
      POSTGRES_PASSWORD: fashion
    volumes:
      - demo_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fashion -d fashion_demo"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://fashion:fashion@db:5432/fashion_demo
      TEST_DATABASE_URL: postgresql+psycopg://fashion:fashion@db:5432/fashion_test
      JWT_SECRET: demo-only-secret-change-before-any-public-deployment-32-characters
      FRONTEND_PUBLIC_URL: http://localhost:15173
      PRODUCT_IMAGE_DIRECTORY: /app/runtime/product-images
    command: ["sh", "-c", "alembic upgrade head && python -m app.seed && uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    ports:
      - "127.0.0.1:18000:8000"
    volumes:
      - demo_product_images:/app/runtime/product-images
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; r=httpx.get('http://127.0.0.1:8000/health'); r.raise_for_status()"]
      interval: 5s
      timeout: 3s
      retries: 30

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.demo
      args:
        VITE_DATABRICKS_DASHBOARD_URL: ${VITE_DATABRICKS_DASHBOARD_URL:-}
        VITE_DATABRICKS_GENIE_URL: ${VITE_DATABRICKS_GENIE_URL:-}
    ports:
      - "127.0.0.1:15173:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/api/health"]
      interval: 5s
      timeout: 3s
      retries: 20

  e2e:
    profiles: ["test"]
    # Exercise the same loopback origin used by the demo on the host. Guest cart
    # UUIDs require a secure context (HTTPS or localhost).
    network_mode: service:frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile.e2e
    environment:
      E2E_BASE_URL: http://localhost
      E2E_API_URL: http://backend:8000
    volumes:
      - ./output/playwright/e2e:/results
    depends_on:
      frontend:
        condition: service_healthy

volumes:
  demo_postgres:
  demo_product_images:
